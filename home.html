<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Chatbot</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .chat-container {
            max-width: 900px;
            min-width: 400px;
            width: 90vw;
            margin: 40px auto;
            background: #f9fafb;
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(44, 62, 80, 0.10);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
            border: 1.5px solid #e5e7eb;
        }

        .chat-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(90deg, #283e51 0%, #485563 100%);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
        }

        .chat-messages {
            flex: 1;
            padding: 2rem 2.5rem 1.5rem 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: #f4f6f8;
        }

        .message {
            max-width: 90%;
            padding: 1.1rem 1.5rem;
            border-radius: 1.5rem;
            font-size: 1.08rem;
            line-height: 1.7;
            word-break: break-word;
            box-shadow: 0 1px 4px rgba(44, 62, 80, 0.04);
            transition: background 0.2s;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(90deg, #283e51 0%, #485563 100%);
            color: #fff;
            border-bottom-right-radius: 0.5rem;
        }

        .bot {
            align-self: flex-start;
            background: #fff;
            color: #283e51;
            border-bottom-left-radius: 0.5rem;
            border: 1px solid #e5e7eb;
        }

        .chat-input {
            display: flex;
            border-top: 1.5px solid #e5e7eb;
            background: #f9fafb;
            padding: 1.1rem 2rem;
        }

        .chat-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1rem;
            background: transparent;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            background: #f4f6f8;
            margin-right: 1rem;
            transition: box-shadow 0.2s;
            box-shadow: 0 1px 4px rgba(44, 62, 80, 0.03);
        }

        .chat-input input:focus {
            box-shadow: 0 2px 8px #283e5133;
        }

        .chat-input button {
            background: linear-gradient(90deg, #283e51 0%, #485563 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px rgba(44, 62, 80, 0.08);
        }

        .chat-input button:hover {
            background: linear-gradient(90deg, #485563 0%, #283e51 100%);
            box-shadow: 0 2px 8px #283e5133;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">Diamond Chatbot</div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Hi! Ask me anything about diamonds. For example: <br><i>"Suggest me a 2 carat
                    diamond with VVS1 clarity from India."</i></div>
        </div>
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Type your diamond query..." autocomplete="off" required />
            <button type="submit">Send</button>
        </form>
    </div>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, sender, typingEffect = false) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            if (!typingEffect) {
                msg.innerHTML = text;
                chatMessages.appendChild(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                msg.innerHTML = '';
                chatMessages.appendChild(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                let i = 0;
                function typeChar() {
                    if (i < text.length) {
                        // Support HTML tags: type by token if tag, else by char
                        if (text[i] === '<') {
                            // Find the end of the tag
                            const tagEnd = text.indexOf('>', i);
                            if (tagEnd !== -1) {
                                msg.innerHTML += text.slice(i, tagEnd + 1);
                                i = tagEnd + 1;
                            } else {
                                msg.innerHTML += text[i++];
                            }
                        } else {
                            msg.innerHTML += text[i++];
                        }
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        setTimeout(typeChar, 12); // Typing speed (ms)
                    }
                }
                typeChar();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;
            appendMessage(query, 'user');
            userInput.value = '';
            // Dynamic status messages
            const statusMessages = [
                'Analyzing your request...',
                'Finding the best diamonds...',
                'Looking for diamonds...',
                'Consulting the gemologist...',
                'Searching the database...',
                'Evaluating your preferences...'
            ];
            const status = statusMessages[Math.floor(Math.random() * statusMessages.length)];
            appendMessage(status, 'bot');
            try {
                const response = await fetch('http://192.167.1.18:8000/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await response.json();
                console.log('Backend response:', data);
                chatMessages.removeChild(chatMessages.lastChild);

                if (data.summary && data.summary.trim()) {
                    const formattedSummary = data.summary.replace(/\n/g, "<br>"); // These three lines are responsible for fromatting the summary to the Chatbot Response on HTML 
                    appendMessage(formattedSummary, 'bot', true);

                }
                else if (Array.isArray(data.diamonds) && data.diamonds.length > 0) {
                    let summary = '<ul style="margin:0 0 0 1em;">';
                    data.diamonds.forEach(diamond => {
                        summary += '<li>' + Object.entries(diamond).map(([k, v]) => `<b>${k}:</b> ${v}`).join(', ') + '</li>';
                    });
                    summary += '</ul>';
                    appendMessage(summary, 'bot', true);
                } else {
                    appendMessage('Sorry, I could not find any diamonds matching your query.', 'bot', true);
                }
            } catch (err) {
                chatMessages.removeChild(chatMessages.lastChild);
                appendMessage('There was an error processing your request.', 'bot', true);
            }
        });
    </script>
</body>

</html>
